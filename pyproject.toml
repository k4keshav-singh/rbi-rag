[project]
name = "rbi-rag"
version = "0.1.0"
description = "Question answering over RBI Master Directions with verifiable citations."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=0.39",
    "fastapi>=0.115",
    "huggingface-hub>=0.26",
    "numpy>=2.0",
    "onnxruntime>=1.20",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pymupdf>=1.24",
    "tokenizers>=0.20",
    "uvicorn[standard]>=0.32",
]

# Heavy ML dependencies live here so CI never installs torch. Embedding and
# reranking run on onnxruntime; sentence-transformers is kept only as the
# reference implementation the ONNX parity test checks against.
# Install with: uv sync --extra ml
[project.optional-dependencies]
ml = [
    "sentence-transformers>=3.3",
    "torch>=2.5",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.13",
    "poethepoet>=0.30",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rbi_rag"]


# --------------------------------------------------------------------------
# Task runner (PowerShell-friendly: every task is a plain command, no shell)
# --------------------------------------------------------------------------
[tool.poe.tasks.lint]
help = "Run ruff check, ruff format --check, and mypy"
sequence = [
    { cmd = "ruff check src tests" },
    { cmd = "ruff format --check src tests" },
    { cmd = "mypy src" },
]

[tool.poe.tasks.fmt]
help = "Auto-fix lint findings and format the code"
sequence = [
    { cmd = "ruff check --fix src tests" },
    { cmd = "ruff format src tests" },
]

[tool.poe.tasks.docs]
help = "Regenerate the generated parts of README and DECISIONS"
cmd = "python -m rbi_rag.docgen"

[tool.poe.tasks.test]
help = "Run unit tests (no database, no network)"
cmd = "pytest"

[tool.poe.tasks.test-integration]
help = "Run tests that need Postgres (start it with db-up first)"
cmd = "pytest -m integration"

[tool.poe.tasks.test-model]
help = "Run tests that download models from HuggingFace"
cmd = "pytest -m model"

[tool.poe.tasks.test-parity]
help = "Check the ONNX embedder against sentence-transformers (needs: uv sync --extra ml)"
cmd = "pytest -m parity"

[tool.poe.tasks.db-up]
help = "Start Postgres + pgvector and wait until healthy"
cmd = "docker compose up -d --wait"

[tool.poe.tasks.db-down]
help = "Stop Postgres (keeps the data volume)"
cmd = "docker compose down"

[tool.poe.tasks.db-nuke]
help = "Stop Postgres and DELETE the data volume"
cmd = "docker compose down -v"

[tool.poe.tasks.db-logs]
help = "Tail Postgres logs"
cmd = "docker compose logs -f postgres"

[tool.poe.tasks.ingest]
help = "Download, parse, chunk and embed RBI Master Directions (Phase 1)"
cmd = "python -m rbi_rag.ingest"

[tool.poe.tasks.query]
help = "Retrieve ranked chunks for a query"
cmd = "python -m rbi_rag.retrieve"

[tool.poe.tasks.index]
help = "Apply migrations and build the search index"
cmd = "python -m rbi_rag.index"

[tool.poe.tasks.serve]
help = "Run the FastAPI application"
cmd = "python -m rbi_rag.api"

[tool.poe.tasks.eval]
help = "Run the evaluation suite and write results/"
cmd = "python -m rbi_rag.eval"


# --------------------------------------------------------------------------
# Lint / format
# --------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# Assertions and loose typing are fine in tests.
"tests/**" = ["S101"]

[tool.ruff.format]
docstring-code-format = true


# --------------------------------------------------------------------------
# Type checking: strict on src/, relaxed on tests/
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# PyMuPDF ships no type information. Confine the resulting looseness to the
# one module that touches it, rather than weakening mypy across src/.
[[tool.mypy.overrides]]
module = "rbi_rag.ingest.parse"
disallow_untyped_calls = false

# onnxruntime ships no py.typed marker; sentence-transformers is only
# installed with the ml extra, so it is absent on the normal path.
[[tool.mypy.overrides]]
module = ["onnxruntime.*", "sentence_transformers.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["rbi_rag.index.embed", "rbi_rag.retrieve.rerank"]
disallow_untyped_calls = false

[tool.pydantic-mypy]
init_typed = true
warn_required_dynamic_aliases = true


# --------------------------------------------------------------------------
# Tests
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# Default run is unit tests only: no database, no network, no model downloads.
addopts = "--strict-markers --strict-config -q -m 'not integration and not parity and not model'"
markers = [
    "integration: requires a running Postgres instance",
    "parity: compares the ONNX embedder against sentence-transformers (needs --extra ml)",
    "model: downloads a model from HuggingFace on first run",
    "live_llm: makes a real Anthropic API call (never run in CI)",
]
