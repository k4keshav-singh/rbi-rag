default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: detect-private-key

  # Local hooks so every tool is the version pinned in pyproject.toml. A
  # ruff-pre-commit rev drifts from the project's own ruff, and the two then
  # reformat each other's output on every commit.
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint, autofix)
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff (format)
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy (strict, src only)
        entry: uv run mypy src
        language: system
        types: [python]
        pass_filenames: false
