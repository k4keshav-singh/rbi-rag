name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python and dependencies
        # No --extra ml here: torch is not needed for lint or unit tests,
        # and installing it would add minutes to every run.
        run: uv sync --locked

      - name: Lint and type-check
        run: uv run poe lint

      - name: Test
        run: uv run poe test
