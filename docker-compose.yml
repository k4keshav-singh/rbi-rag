services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rbi-rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rbi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rbi}
      POSTGRES_DB: ${POSTGRES_DB:-rbi_rag}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rbi} -d ${POSTGRES_DB:-rbi_rag}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  pgdata:
